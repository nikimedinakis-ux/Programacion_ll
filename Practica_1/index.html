<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrega de Prácticas - Programación II</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117; 
            color: #c9d1d9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        .avatar-placeholder {
            width: 80px;
            height: 80px;
            background-color: #238636; 
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            line-height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px auto;
        }
        h1 {
            font-size: 24px;
            color: #ffffff;
            margin: 0 0 10px 0;
            font-weight: 600;
        }
        .subtitle {
            font-size: 14px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        .btn-github {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #21262d;
            color: #c9d1d9;
            text-decoration: none;
            padding: 12px 24px;
            border: 1px solid #f0f6fc1f;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
            width: 80%;
        }
        .btn-github:hover {
            background-color: #30363d;
            border-color: #8b949e;
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar-placeholder">NM</div>
        <h1>Nicol Yasmin Medina Quispe</h1>
        <div class="subtitle">Programación II</div>
        <a href="https://github.com/nikimedinakis-ux/Programacion_ll.git" target="_blank" class="btn-github">
            🖥️ Ver Repositorio GitHub
        </a>
    </div>

</body>
</html>
